<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama 3.2 Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            color: white;
            font-size: 1.5em;
            font-weight: 600;
        }

        .status {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            margin-top: 5px;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        .message.user {
            background: #007AFF;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-container {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            resize: none;
            min-height: 44px;
            max-height: 120px;
        }

        #messageInput:focus {
            outline: none;
            background: white;
        }

        #sendButton {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: #007AFF;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.3s;
        }

        #sendButton:hover:not(:disabled) {
            background: #0056b3;
        }

        #sendButton:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* iOS safe area */
        @supports (padding: max(0px)) {
            .header {
                padding-top: max(15px, env(safe-area-inset-top));
            }
            
            .input-container {
                padding-bottom: max(20px, env(safe-area-inset-bottom));
            }
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .message {
                max-width: 90%;
            }
            
            .messages {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🦙 Llama 3.2 Chat</h1>
        <div class="status" id="status">Loading model...</div>
    </div>

    <div class="chat-container">
        <div class="messages" id="messages">
            <div class="message assistant">
                Hello! I'm Llama 3.2, your AI assistant. How can I help you today?
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Type your message..."
                    rows="1"
                ></textarea>
                <button id="sendButton" disabled>
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const statusDiv = document.getElementById('status');
        
        let conversationHistory = [];
        let isModelLoaded = false;

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        // Send message on Enter (but not Shift+Enter)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);

        // Check model status
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                if (data.model_loaded) {
                    statusDiv.textContent = 'Model ready ✓';
                    statusDiv.style.color = '#4CAF50';
                    sendButton.disabled = false;
                    isModelLoaded = true;
                } else if (data.model_loading) {
                    statusDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Loading model...</div>';
                    setTimeout(checkStatus, 2000);
                } else {
                    statusDiv.textContent = 'Model failed to load ✗';
                    statusDiv.style.color = '#f44336';
                }
            } catch (error) {
                console.error('Status check failed:', error);
                statusDiv.textContent = 'Connection error ✗';
                statusDiv.style.color = '#f44336';
                setTimeout(checkStatus, 5000);
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || !isModelLoaded) return;

            // Add user message to chat
            addMessage(message, 'user');
            conversationHistory.push({role: 'user', content: message});
            
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendButton.disabled = true;

            // Show typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message assistant';
            typingDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Thinking...</div>';
            messagesDiv.appendChild(typingDiv);
            scrollToBottom();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        history: conversationHistory
                    })
                });

                // Remove typing indicator
                typingDiv.remove();

                if (response.ok) {
                    const data = await response.json();
                    addMessage(data.response, 'assistant');
                    conversationHistory.push({role: 'assistant', content: data.response});
                } else {
                    const error = await response.json();
                    addMessage(`Sorry, there was an error: ${error.error}`, 'assistant');
                }
            } catch (error) {
                console.error('Error:', error);
                typingDiv.remove();
                addMessage('Sorry, I encountered a connection error. Please try again.', 'assistant');
            }

            sendButton.disabled = false;
        }

        function addMessage(text, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.textContent = text;
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Start status checking
        checkStatus();
    </script>
</body>
</html>
